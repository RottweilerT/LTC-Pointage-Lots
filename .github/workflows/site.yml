name: Publier le site

# Met en ligne le site sur GitHub Pages à chaque modification de la branche main.
# Réglage nécessaire une seule fois : Settings → Pages → Source : « GitHub Actions ».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Préparer les fichiers du site
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest .nojekyll *.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
